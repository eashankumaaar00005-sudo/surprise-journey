<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>A Secret Journey ❤️</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>

</head>

<body>

<!-- Loader -->

<div id="loader">

<div class="loader-circle"></div>

</div>

<!-- Mouse Light -->

<div class="mouse-light"></div>

<!-- Stars -->

<div class="stars"></div>

<!-- Floating Glow -->

<div class="glow-orb glow-one"></div>

<div class="glow-orb glow-two"></div>

<!-- Hero -->

<section class="hero">

<div class="glass hero-card">

<div class="badge">

✨ JUST FOR YOU

</div>

<h1>

A Secret

Journey

</h1>

<p>

Someone spent time creating
something beautiful just for you.

Take a deep breath...

and begin the journey.

</p>

<!-- Envelope -->

<div class="envelope"
id="envelope">

<div class="envelope-shadow"></div>

<div class="envelope-back">

<div class="envelope-left"></div>

<div class="envelope-right"></div>

<div class="envelope-bottom"></div>

</div>

<div class="letter-paper">

<span>❤️</span>

</div>

<div class="envelope-top"></div>

</div>

<button

class="btn"

id="startJourney">

Open Letter

</button>

</div>

</section>

<script src="js/script.js"></script>

</body>

</html>
